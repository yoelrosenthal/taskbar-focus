name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Rust ships preinstalled on the Windows runner; using it directly keeps
      # third-party actions out of the build path.
      - name: Set up toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      - name: Formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # --locked so CI fails loudly if Cargo.lock is out of date, rather than
      # silently resolving different dependency versions than were reviewed.
      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked
