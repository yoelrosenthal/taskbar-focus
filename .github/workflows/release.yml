name: Release

# Tag a commit to publish it:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # Sigstore signing identity for the attestation
  attestations: write # upload the provenance attestation

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        run: |
          rustup update stable
          rustup default stable

      # Fail before anything is published rather than after. A tag that does not
      # match Cargo.toml would otherwise ship a release labelled one version and
      # a crate containing another, and crates.io publishes cannot be undone.
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $manifest = $line.Matches[0].Groups[1].Value
          if ($tag -ne $manifest) {
            throw "tag '$tag' does not match Cargo.toml version '$manifest'"
          }
          Write-Host "releasing $tag"

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Stage artifacts and hash them
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\taskbar-focus.exe dist\
          $h = (Get-FileHash dist\taskbar-focus.exe -Algorithm SHA256).Hash.ToLower()
          "$h *taskbar-focus.exe" | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA-256: $h"

      # Attestations need a public repository on Free/Pro/Team plans; only
      # Enterprise Cloud supports them privately. Skipping rather than failing
      # means a repository can be kept private until it is ready to publish.
      - name: Generate build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/taskbar-focus.exe

      - name: Note the skipped attestation
        if: ${{ github.event.repository.private }}
        shell: pwsh
        run: |
          Write-Host "::notice::Repository is private, so no build provenance attestation was created. Make it public to enable them."

      - name: Update the Scoop manifest
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $hash = (Get-FileHash dist\taskbar-focus.exe -Algorithm SHA256).Hash.ToLower()
          $path = 'bucket\taskbar-focus.json'
          $m = Get-Content $path -Raw | ConvertFrom-Json
          $m.version = $version
          $m.architecture.'64bit'.url =
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/taskbar-focus.exe#/taskbar-focus.exe"
          $m.architecture.'64bit'.hash = $hash
          $m | ConvertTo-Json -Depth 10 | Set-Content $path -Encoding utf8
          Copy-Item $path dist\
          Write-Host "manifest updated to $version / $hash"

      - name: Commit the updated manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/taskbar-focus.json
          if (git diff --cached --quiet) { Write-Host "manifest unchanged" ; exit 0 }
          git commit -m "scoop: ${{ github.ref_name }}"
          git push origin HEAD:main

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Verifying this download

          This binary is built by GitHub Actions from the tagged commit. If the repository is public it also carries a build provenance attestation:

          ``````
          gh attestation verify taskbar-focus.exe --repo ${{ github.repository }}
          ``````

          That proves it was built from this repository by this workflow — a stronger
          claim than an unsigned file, and one no attacker can forge without access to
          the repository itself.

          Checksum: see ``SHA256SUMS.txt``.

          ## Antivirus

          This app toggles Windows "Do not disturb", which some endpoint products flag.
          Run ``taskbar-focus.exe --explain`` to see exactly what it touches, and see
          the README.
          "@
          gh release create "${{ github.ref_name }}" `
            dist/taskbar-focus.exe dist/SHA256SUMS.txt dist/taskbar-focus.json `
            --title "taskbar-focus ${{ github.ref_name }}" `
            --notes $notes

      # Last, because it is the only irreversible step: a crates.io version can
      # be yanked but never replaced or removed. If it fails, everything else
      # has already succeeded and it can be retried by hand.
      - name: Publish to crates.io
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if (-not $env:CARGO_REGISTRY_TOKEN) {
            Write-Host "::notice::No CARGO_REGISTRY_TOKEN secret set - skipping crates.io publish."
            exit 0
          }

          $version = "${{ github.ref_name }}" -replace '^v',''
          try {
            $crate = Invoke-RestMethod "https://crates.io/api/v1/crates/taskbar-focus" `
              -Headers @{ 'User-Agent' = 'taskbar-focus-release' } -ErrorAction Stop
            if ($crate.versions.num -contains $version) {
              Write-Host "::notice::taskbar-focus $version is already on crates.io - nothing to do."
              exit 0
            }
          } catch {
            Write-Host "crate not on crates.io yet; this will be the first publish."
          }

          cargo publish --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo publish failed ($LASTEXITCODE)" }
          Write-Host "published taskbar-focus $version"
