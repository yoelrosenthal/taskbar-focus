name: Release

# Normally called by release-on-merge.yml once it has tagged the commit. The
# tag trigger stays so a release can still be cut by hand:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.2.0"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release
  id-token: write # Sigstore signing identity for the attestation
  attestations: write # upload the provenance attestation

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up toolchain
        run: |
          rustup update stable
          rustup default stable

      # Fail before anything is published rather than after. A tag that does not
      # match Cargo.toml would otherwise ship a release labelled one version and
      # a crate containing another, and crates.io publishes cannot be undone.
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = $env:TAG -replace '^v',''
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $manifest = $line.Matches[0].Groups[1].Value
          if ($tag -ne $manifest) {
            throw "tag '$tag' does not match Cargo.toml version '$manifest'"
          }
          Write-Host "releasing $tag"

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Stage artifacts and hash them
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\taskbar-focus.exe dist\
          $h = (Get-FileHash dist\taskbar-focus.exe -Algorithm SHA256).Hash.ToLower()
          "$h *taskbar-focus.exe" | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          "hash=$h" | Add-Content $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $h"

      # Attestations need a public repository on Free/Pro/Team plans; only
      # Enterprise Cloud supports them privately. Skipping rather than failing
      # means a repository can be kept private until it is ready to publish.
      - name: Generate build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/taskbar-focus.exe

      - name: Note the skipped attestation
        if: ${{ github.event.repository.private }}
        shell: pwsh
        run: |
          Write-Host "::notice::Repository is private, so no build provenance attestation was created. Make it public to enable them."

      # Written onto main rather than onto the detached tag checkout. Rebuilt
      # from a fresh origin/main on every attempt, because anything else landing
      # on main between the fetch and the push rejects it as non-fast-forward.
      - name: Update the Scoop manifest on main
        shell: pwsh
        env:
          HASH: ${{ steps.stage.outputs.hash }}
        run: |
          $version = $env:TAG -replace '^v',''
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $done = $false
          foreach ($attempt in 1..5) {
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main

            $path = 'bucket\taskbar-focus.json'
            $m = Get-Content $path -Raw | ConvertFrom-Json
            $m.version = $version
            $m.architecture.'64bit'.url =
              "https://github.com/${{ github.repository }}/releases/download/$env:TAG/taskbar-focus.exe#/taskbar-focus.exe"
            $m.architecture.'64bit'.hash = $env:HASH
            $m | ConvertTo-Json -Depth 10 | Set-Content $path -Encoding utf8
            Copy-Item $path dist\ -Force

            git add $path
            if (git diff --cached --quiet) {
              Write-Host "manifest already up to date on main"
              $done = $true
              break
            }

            git commit -m "scoop: $env:TAG"
            git push origin main
            if ($LASTEXITCODE -eq 0) {
              Write-Host "manifest updated to $version / $env:HASH"
              $done = $true
              break
            }
            Write-Host "::notice::main moved under us; refetching and retrying ($attempt of 5)."
          }

          if (-not $done) {
            throw "could not push the Scoop manifest to main after 5 attempts"
          }

          # Back to the tag, so the later steps - crates.io above all - see the
          # source that was actually tagged rather than whatever main holds now.
          git checkout --detach $env:TAG

      - name: Build the release notes
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v',''
          $changelog = ''
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = ($lines | Select-String -Pattern ("^## \[" + [regex]::Escape($version) + "\]") | Select-Object -First 1).LineNumber
            if ($start -and $start -lt $lines.Count) {
              $rest = @($lines[$start..($lines.Count - 1)])
              $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
              if ($end) { $rest = $rest[0..($end - 2)] }
              $changelog = ($rest -join "`n").Trim()
            }
          }
          if (-not $changelog) { $changelog = '_No changelog section found for this version._' }

          $notes = @"
          $changelog

          ## Install

          ``````
          scoop bucket add taskbar-focus https://github.com/${{ github.repository }}
          scoop install taskbar-focus
          ``````

          ## Verifying this download

          This binary is built by GitHub Actions from the tagged commit. If the repository is public it also carries a build provenance attestation:

          ``````
          gh attestation verify taskbar-focus.exe --repo ${{ github.repository }}
          ``````

          That proves it was built from this repository by this workflow — a stronger
          claim than an unsigned file, and one no attacker can forge without access to
          the repository itself.

          Checksum: see ``SHA256SUMS.txt``.

          ## Antivirus

          This app toggles Windows "Do not disturb", which some endpoint products flag.
          Run ``taskbar-focus.exe --explain`` to see exactly what it touches, and see
          the README.
          "@
          $notes | Set-Content dist\NOTES.md -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG `
            dist/taskbar-focus.exe dist/SHA256SUMS.txt dist/taskbar-focus.json `
            --title "taskbar-focus $env:TAG" `
            --notes-file dist/NOTES.md

      # Last, because it is the only irreversible step: a crates.io version can
      # be yanked but never replaced or removed. If it fails, everything else
      # has already succeeded and it can be retried by hand.
      - name: Publish to crates.io
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if (-not $env:CARGO_REGISTRY_TOKEN) {
            Write-Host "::notice::No CARGO_REGISTRY_TOKEN secret set - skipping crates.io publish."
            exit 0
          }

          $version = $env:TAG -replace '^v',''
          try {
            $crate = Invoke-RestMethod "https://crates.io/api/v1/crates/taskbar-focus" `
              -Headers @{ 'User-Agent' = 'taskbar-focus-release' } -ErrorAction Stop
            if ($crate.versions.num -contains $version) {
              Write-Host "::notice::taskbar-focus $version is already on crates.io - nothing to do."
              exit 0
            }
          } catch {
            Write-Host "crate not on crates.io yet; this will be the first publish."
          }

          cargo publish --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo publish failed ($LASTEXITCODE)" }
          Write-Host "published taskbar-focus $version"
